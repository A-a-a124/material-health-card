<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material Health Card</title>
<style>
:root{--paper:#f5f1e8;--card:#fffdf8;--ink:#1b2236;--mute:#6b7186;--line:#e2dccd;--accent:#2447d6;--good:#1f8a5b;--warn:#c47a09;--bad:#c2372f;--soft:#eee8da;--serif:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:16px 28px;border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:20px}
h1{font-family:var(--serif);font-size:22px;margin:0;letter-spacing:.3px;font-weight:700}
.tag{color:var(--mute);font-size:13px}
.sample{margin-left:auto;font-size:12px;font-weight:600;color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:4px 12px;background:#fff8ea;white-space:nowrap}
.wrap{display:grid;grid-template-columns:290px 1fr;gap:24px;padding:22px 28px;max-width:1280px;margin:auto}
aside{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;align-self:start}
aside input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;margin-bottom:8px}
.pitem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;font:inherit;color:inherit;padding:9px 10px;border-radius:10px;cursor:pointer}
.pitem:hover{background:var(--soft)}.pitem.on{background:var(--ink);color:#fff}.pitem.on small{color:#c9cee0}
.pitem small{display:block;color:var(--mute);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 32px;position:relative;box-shadow:0 10px 30px -18px rgba(27,34,54,.35)}
.eyebrow{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent);font-weight:700}
h2{font-family:var(--serif);font-size:31px;font-weight:700;letter-spacing:.2px;margin:4px 190px 4px 0}
.meta{color:var(--mute);font-size:13.5px;margin-right:190px}
.meta b{color:var(--ink);font-weight:600}
.stamp{position:absolute;top:26px;right:30px;transform:rotate(7deg);border:3px double currentColor;border-radius:12px;padding:8px 18px;font-family:var(--serif);font-weight:700;letter-spacing:3px;text-align:center;font-size:18px;transition:color .4s}
.stamp small{display:block;font-family:"Segoe UI",system-ui,sans-serif;font-size:10.5px;letter-spacing:1.2px;font-weight:600;text-transform:uppercase}
.ages{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:22px;margin:26px 0 8px;align-items:center}
.dial{text-align:center}
.dial svg{width:150px;height:150px;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:11;stroke-linecap:round}
.dial .bg{stroke:var(--soft)}.dial .fg{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1),stroke .4s}
.dial .num{margin-top:-110px;height:110px;font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.55;font-variant-numeric:lining-nums}
.dial .num small{display:block;font-family:"Segoe UI",system-ui,sans-serif;font-size:11.5px;color:var(--mute);font-weight:500;letter-spacing:.2px}
.dial .lab{font-size:13px;font-weight:600;margin-top:2px}.dial .lab span{display:block;color:var(--mute);font-weight:400;font-size:12px}
.say{font-size:17px;line-height:1.55}.say b{color:var(--accent);font-family:var(--serif);font-size:19px;font-variant-numeric:lining-nums}
.lifebar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;margin:14px 0 4px}
.lifebar i{display:block;height:100%;border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1),background .4s}
h3{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mute);margin:26px 0 10px}
.hint{margin:-4px 0 10px;color:var(--mute);font-size:13.5px}
.tl{display:flex;gap:3px;height:84px}
.seg{border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;min-width:58px;overflow:hidden;white-space:nowrap;animation:grow .7s both;transform-origin:left;line-height:1.1}
.seg b{font-family:var(--serif);font-size:34px;font-weight:700;letter-spacing:.5px;font-variant-numeric:lining-nums}.seg b i{font-style:normal;font-weight:400;font-size:22px;margin-left:2px;opacity:.85}
.seg span{font-size:11px;font-weight:600;letter-spacing:2.2px;text-transform:uppercase;opacity:.92;margin-top:3px}
.seg.still{animation:none}.seg.fut{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.3) 0 8px,transparent 8px 16px);outline:2px dashed var(--ink);outline-offset:-2px}
@keyframes grow{from{transform:scaleX(0)}}
.tlk{display:flex;gap:3px;margin-top:10px}.tlk div{font-size:13.5px;color:var(--mute);min-width:58px}.tlk b{display:block;color:var(--ink);font-family:var(--serif);font-size:18px;margin-bottom:1px}.tlk em{display:block;font-style:normal;color:var(--ink);font-weight:600}
.z-ac{background:#2f5f86}.z-wh{background:#4f6f59}.z-shade{background:#9a6d1f}.z-yard{background:#9b3a26}
.two{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row:last-child{border:0}.row .s{margin-left:auto;font-size:12.5px;font-weight:600;white-space:nowrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:none;color:var(--ink)}.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn:hover{opacity:.88}
.hbtn{padding:6px 14px;font-size:13px}
.fc{background:var(--soft);border-radius:14px;padding:14px 16px;font-size:14px}
.fc p{margin:0 0 8px}.fc b{font-family:var(--serif);font-size:17px;font-variant-numeric:lining-nums}
.ahead{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed #d6cfbd;font-weight:600}
.ahead input{flex:1;accent-color:var(--accent);cursor:pointer}.ahead span{min-width:74px;text-align:right;color:var(--accent)}
.fc .ahcap{margin:6px 0 0;font-size:13.5px;color:var(--mute)}.fc .ahcap b{font-size:15px;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:99px;padding:3px 8px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}.chip .dot{width:8px;height:8px}
.stamp.pop{animation:pop .45s}@keyframes pop{0%{transform:rotate(7deg) scale(1.35)}100%{transform:rotate(7deg) scale(1)}}
.foot{display:flex;gap:14px;align-items:center;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.note{color:var(--mute);font-size:12.5px}
.sign{display:none}
footer{text-align:center;color:var(--mute);font-size:12.5px;padding:6px 0 26px}
@media(max-width:900px){header{flex-wrap:wrap;padding:14px 16px}.sample{margin-left:0}#list{max-height:176px;overflow:auto}.card{padding:20px 18px}.wrap{grid-template-columns:1fr;padding:16px}.ages,.two{grid-template-columns:1fr}.stamp{position:static;display:inline-block;margin-top:12px}h2,.meta{margin-right:0}.foot{flex-direction:column;align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
 body{background:#fff}aside,.btn,footer,.ahead,.ahcap{display:none!important}
 .wrap{display:block;padding:0}.card{border:2px solid var(--ink);box-shadow:none}
 header{border:0;padding:0 0 12px}h1::after{content:" · Handover Certificate"}
 .sign{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:46px}
 .sign div{border-top:1px solid var(--ink);padding-top:6px;font-size:12.5px}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header>
  <div class="logo">&#9829;</div>
  <div><h1>Material Health Card</h1><div class="tag">Every warehouse knows what it holds. This one also knows how much life each part has left.</div></div>
  <div class="sample">Sample data · concept demo</div>
  <button class="btn hbtn" id="xl">Export register · Excel</button>
</header>
<div class="wrap">
  <aside><input id="q" placeholder="Search by name or number…" aria-label="Search by name or number"><div class="chips" id="chips"></div><div id="list"></div></aside>
  <main class="card" id="card"></main>
</div>
<footer>Runs fully offline · no data leaves this computer · Designed by Abdullah Aladhyani</footer>
<script>
// ---- sample model: storage zones, material families, parts ----
const ZONES={ac:{name:'Air-conditioned store',T:22,RH:40},wh:{name:'Covered warehouse',T:31,RH:50},shade:{name:'Shaded yard',T:35,RH:58},yard:{name:'Open yard',T:37,RH:60,sun:true}};
// life = shelf life in months at 25°C; q = speed-up per +10°C; hs/ss = humidity and sunlight sensitivity
const FAM={elastomer:{name:'Rubber seal',life:60,q:2,hs:.3,ss:.5},gasket:{name:'Gasket',life:72,q:1.8,hs:.3,ss:.3},grease:{name:'Greased bearing',life:36,q:2,hs:.4,ss:.1},
 motor:{name:'Electric motor',life:120,q:1.5,hs:.6,ss:.2},belt:{name:'Rubber belt',life:72,q:2,hs:.2,ss:.6},card:{name:'Electronic card',life:120,q:1.5,hs:.8,ss:0},
 valve:{name:'Valve assembly',life:180,q:1.2,hs:.7,ss:.2},hose:{name:'Hydraulic hose',life:48,q:2,hs:.2,ss:.6},lube:{name:'Lubricant',life:60,q:1.8,hs:.2,ss:.3},paint:{name:'Coating',life:24,q:1.8,hs:.1,ss:.3}};
// stay = [zone, months], oldest first. care = [task, every N months, last done N months ago]
const PARTS=[
 {id:'1000950001',name:'Mech seal P-101A',fam:'elastomer',client:'Aramco · Yanbu Refinery',loc:'WH-02 · D27-03-1',stay:[['yard',8],['wh',18]],care:[['Keep in a sealed bag, away from light',12,5]]},
 {id:'1000950009',name:'Dry gas seal K-201',fam:'elastomer',client:'Aramco · Yanbu Refinery',loc:'AC-01 · B04-02-3',stay:[['ac',14]],care:[['Check the packaging and desiccant',6,2]]},
 {id:'1000950023',name:'Turbine governor valve G-401',fam:'valve',client:'Aramco · Yanbu Refinery',loc:'Yard C · bay 12',stay:[['shade',40]],care:[['Renew the rust-preventive coating',12,19],['Check the end caps and covers',6,4]]},
 {id:'1000960004',name:'Motor 75 kW, 4-pole',fam:'motor',client:'Client B · Industrial City',loc:'WH-03 · floor F2',stay:[['wh',30]],care:[['Rotate the shaft by hand',3,7],['Measure the winding insulation',12,10]]},
 {id:'1000960011',name:'Bearing 6310 C3',fam:'grease',client:'Aramco · Yanbu Refinery',loc:'WH-01 · A11-05-2',stay:[['wh',20]],care:[['Keep flat in its original wrapping',12,6]]},
 {id:'1000960017',name:'Spiral wound gasket 4" 300#',fam:'gasket',client:'Client C · Industrial City',loc:'AC-01 · C02-01-1',stay:[['ac',50]],care:[['Store flat; do not hang',12,8]]},
 {id:'1000960022',name:'V-belt set SPB 2500',fam:'belt',client:'Client B · Industrial City',loc:'Yard A · rack 3',stay:[['yard',30]],care:[['Move out of direct sunlight',6,30]]},
 {id:'1000960030',name:'DCS I/O card',fam:'card',client:'Aramco · Yanbu Refinery',loc:'AC-02 · E01-04-2',stay:[['ac',36]],care:[['Replace the desiccant in the anti-static bag',12,14]]},
 {id:'1000960036',name:'Hydraulic hose 1" x 6 m',fam:'hose',client:'Client C · Industrial City',loc:'Yard A · rack 7',stay:[['yard',18]],care:[['Cap both ends',12,3]]},
 {id:'1000960041',name:'Bearing grease, 180 kg drum',fam:'lube',client:'Aramco · Yanbu Refinery',loc:'Yard B · shade 2',stay:[['shade',22]],care:[['Store the drum on its side',12,9]]},
 {id:'1000960048',name:'O-ring kit, Viton',fam:'elastomer',client:'Aramco · Yanbu Refinery',loc:'AC-01 · B07-03-4',stay:[['yard',12],['ac',36]],care:[['Keep in a sealed bag, away from light',12,4]]},
 {id:'1000960055',name:'Epoxy coating, 2-part',fam:'paint',client:'Client B · Industrial City',loc:'WH-02 · P01-02-1',stay:[['wh',14]],care:[['Keep the lids sealed',6,2]]}];

// how many times faster a family ages in a zone than at 25°C and 50% humidity
const rate=(f,z)=>Math.pow(f.q,(z.T-25)/10)*(1+f.hs*Math.max(0,z.RH-50)/50)*(z.sun?1+f.ss:1);
function assess(p,st){
  st=st||{}; const f=FAM[p.fam], ah=st.ahead||0; let paper=0,real=0;
  const here=st.moved?'ac':p.stay[p.stay.length-1][0];
  // a look-ahead adds one future stay in the place the part is in now
  const stays=ah?p.stay.concat([[here,ah,true]]):p.stay;
  const segs=stays.map(([z,m,fut])=>{const r=rate(f,ZONES[z]);paper+=m;real+=m*r;return{z,m,r,fut}});
  const care=p.care.map(([t,every,last],i)=>{const l=(st.done&&st.done[i]?0:last)+ah;return{t,every,last:l,over:l>every}});
  const used=real/f.life*100;
  const left=Math.max(0,(f.life-real)/rate(f,ZONES[here])), leftAc=Math.max(0,(f.life-real)/rate(f,ZONES.ac));
  const over=care.some(c=>c.over);
  const v=used>=100?{k:'bad',t:'HOLD',s:'inspect before issue'}:used>=75||over?{k:'warn',t:'CARE NEEDED',s:over?'care task overdue':'nearing end of shelf life'}:{k:'good',t:'FIT TO ISSUE',s:'stored as required'};
  return{f,paper,real,segs,care,used,here,left,leftAc,v};
}
const COL={good:'var(--good)',warn:'var(--warn)',bad:'var(--bad)'};
const ym=m=>{m=Math.round(m);const y=Math.floor(m/12),r=m%12;return ((y?y+' yr ':'')+(r||!y?r+' mo':'')).trim()};
const when=m=>{const d=new Date();d.setMonth(d.getMonth()+Math.round(m));return d.toLocaleDateString('en-GB',{month:'short',year:'numeric'})};
const ago=m=>{const d=new Date();d.setMonth(d.getMonth()-m);return d.toLocaleDateString('en-GB',{month:'short',year:'numeric'})};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nice=t=>t[0]+t.slice(1).toLowerCase();
const $=id=>document.getElementById(id);
const CIRC=2*Math.PI*62;
let cur=PARTS[0].id, filt='all'; const state={};
// the list and the counters always show today, never a look-ahead
const today=p=>assess(p,Object.assign({},state[p.id],{ahead:0}));

function dial(id,label,sub){
  return `<div class="dial"><svg viewBox="0 0 150 150"><circle class="bg" cx="75" cy="75" r="62"/><circle class="fg" id="${id}r" cx="75" cy="75" r="62" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}"/></svg>
  <div class="num"><div style="padding-top:8px"><span id="${id}n"></span><small id="${id}s"></small></div></div><div class="lab">${label}<span>${sub}</span></div></div>`;
}
function renderList(){
  const q=$('q').value.toLowerCase(), all=PARTS.map(p=>({p,a:today(p)}));
  const n=k=>all.filter(x=>x.a.v.k===k).length;
  $('chips').innerHTML=[['all','All',all.length],['good','Fit',n('good')],['warn','Care',n('warn')],['bad','Hold',n('bad')]]
    .map(([k,t,c])=>`<button class="chip ${filt===k?'on':''}" data-f="${k}">${k==='all'?'':`<span class="dot" style="background:${COL[k]}"></span>`}${t} <b>${c}</b></button>`).join('');
  $('list').innerHTML=all.filter(x=>(filt==='all'||x.a.v.k===filt)&&(x.p.name+x.p.id).toLowerCase().includes(q)).map(({p,a})=>
    `<button class="pitem ${p.id===cur?'on':''}" data-id="${p.id}"><span class="dot" style="background:${COL[a.v.k]}"></span><span>${esc(p.name)}<small>${p.id} · ${nice(a.v.t)}</small></span></button>`).join('')||'<div class="note" style="padding:10px">No matching part.</div>';
}
function renderCard(){
  const p=PARTS.find(x=>x.id===cur), st=state[p.id]=state[p.id]||{done:{}}, b=today(p), zoneNow=ZONES[b.here].name;
  $('card').innerHTML=`
  <div class="eyebrow">Material health card</div>
  <h2>${esc(p.name)}</h2>
  <div class="meta">SAP <b>${p.id}</b> · ${b.f.name} · Owner: <b>${esc(p.client)}</b> · Location: <b>${esc(st.moved?'AC-01 (simulated move)':p.loc)}</b></div>
  <div class="stamp" id="stamp"></div>
  <div class="ages">
    ${dial('d0','Calendar age','time since receipt')}
    ${dial('d1','Real age','adjusted for storage conditions')}
    <div><div class="say" id="say"></div>
      <div class="lifebar"><i id="bar" style="width:0"></i></div>
      <div class="note" id="pct"></div></div>
  </div>
  <h3>Storage history</h3>
  <p class="hint">Each block is a place where the part was stored. The figure shows how many times faster it aged there than in ideal storage (1.0×).</p>
  <div class="tl" id="tl"></div>
  <div class="tlk" id="tlk"></div>
  <div class="two">
    <div><h3>Care record</h3><div id="care"></div></div>
    <div><h3>Outlook</h3><div class="fc">
      ${b.used>=100?`<p>This part is past its shelf life. <b>Inspect or test it before issuing it to the plant.</b></p>`
       :`<p>If it stays in the <b>${zoneNow.toLowerCase()}</b>, it will reach the end of its shelf life in <b>${ym(b.left)}</b> (${when(b.left)}).</p>
         ${b.here!=='ac'?`<p>In the air-conditioned store it would last <b>${ym(b.leftAc)}</b> (${when(b.leftAc)}), which is <b>${ym(b.leftAc-b.left)}</b> longer.</p>`:st.moved?'':`<p>It is already in the best storage available. No move is needed.</p>`}`}
      ${b.used<100&&(b.here!=='ac'||st.moved)?`<button class="btn sm ghost" id="mv">${st.moved?'Undo the move':'Simulate the move'}</button>`:''}
      <div class="ahead"><label for="ah">Look ahead</label><input type="range" id="ah" min="0" max="36" step="1" value="${st.ahead||0}"><span id="ahv"></span></div>
      <p class="ahcap" id="ahcap"></p></div></div>
  </div>
  <div class="foot"><button class="btn" id="pdf">Download PDF certificate</button>
    <span class="note">Real age is a simplified estimate. For this type of material, every 10°C above 25°C makes it age about ${b.f.q} times faster, with allowances for humidity and sunlight. Simulations on this page change nothing in any system.</span></div>
  <div class="sign"><div>Issued by: Materials Services Warehouse · ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}<br>Certificate no. MHC-${p.id}-${new Date().toISOString().slice(0,10).replace(/-/g,'')}</div><div>Received by: name and signature</div></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>paint()));
}
// update everything that depends on the look-ahead without rebuilding the slider
function paint(quiet){
  const p=PARTS.find(x=>x.id===cur), st=state[p.id], ah=st.ahead||0, a=assess(p,st), c=COL[a.v.k];
  const stamp=$('stamp'), was=stamp.dataset.k;
  stamp.style.color=c; stamp.innerHTML=`${a.v.t}<small>${ah?'in '+ym(ah)+' · simulated':a.v.s}</small>`;
  if(was&&was!==a.v.k){stamp.classList.remove('pop');void stamp.offsetWidth;stamp.classList.add('pop')} stamp.dataset.k=a.v.k;
  [['d0',a.paper,'var(--mute)'],['d1',a.real,c]].forEach(([id,m,col])=>{
    $(id+'r').style.stroke=col; $(id+'r').style.strokeDashoffset=CIRC*(1-Math.min(1,m/a.f.life));
    $(id+'n').textContent=ym(m); $(id+'s').textContent='of '+ym(a.f.life)+' shelf life'});
  const ratio=a.real/a.paper;
  $('say').innerHTML=ah?`In ${ym(ah)}, this part will be <b>${ym(a.paper)}</b> old by the calendar and <b>${ym(a.real)}</b> old in real terms.`
    :ratio>1.25?`By the calendar, this part is <b>${ym(a.paper)}</b> old. The heat and humidity it was stored in have aged it to the equivalent of <b>${ym(a.real)}</b>.`
    :ratio<0.9?`By the calendar, this part is <b>${ym(a.paper)}</b> old. Good storage has kept its real age down to <b>${ym(a.real)}</b>.`
    :`This part is <b>${ym(a.paper)}</b> old, and its real age is about the same. It has been stored as required.`;
  $('bar').style.width=Math.min(100,a.used)+'%'; $('bar').style.background=c;
  $('pct').innerHTML=`<b style="color:${c}">${Math.round(a.used)}%</b> of its shelf life used${a.used>=100?' · beyond the limit':''}`;
  let start=a.paper-ah;
  $('tl').innerHTML=a.segs.map(s=>`<div class="seg z-${s.z} ${s.fut?'fut':''} ${quiet?'still':''}" style="flex:${s.m}" title="${ZONES[s.z].name}: ${s.m} months at about ${ZONES[s.z].T}°C, ageing ${s.r.toFixed(1)} times faster than ideal storage"><b>${s.r.toFixed(1)}<i>×</i></b><span>${s.fut?'projected':'ageing rate'}</span></div>`).join('');
  $('tlk').innerHTML=a.segs.map(s=>{if(s.fut)return `<div style="flex:${s.m}"></div>`;const from=ago(start);start-=s.m;
    return `<div style="flex:${s.m}"><b>${ZONES[s.z].name}</b>${s.m} months from ${from} · about ${ZONES[s.z].T}°C<em>Counts as ${ym(s.m*s.r)} of ageing</em></div>`}).join('');

  // sheet 4: the assumptions behind the numbers
  const r4=[title('Method and assumptions'),note('Real age = sum of months in each place × how much faster that place ages the material than 25°C and 50% humidity'),null,
    ['Storage place','Average temperature (°C)','Relative humidity (%)','Direct sunlight'].map(h=>[h,1]),...Object.values(ZONES).map(z=>[[z.name,12],[z.T,4],[z.RH,4],[z.sun?'Yes':'No',8]]),null,
    ['Material type','Shelf life at 25°C (months)','Speed-up per +10°C','Humidity sensitivity','Sunlight sensitivity'].map(h=>[h,1]),...Object.values(FAM).map(f=>[[f.name,12],[f.life,4],[f.q,13],[f.hs,13],[f.ss,13]]),null,
    note('These are illustrative values for a demo. In practice the engineers set them per material.')];
  const S=[['Health register',sheet(r1,{widths:[13,30,17,26,22,13,13,13,13,13,14,14,13,14],freeze:4,filter:`A4:N${last}`,tall:{1:24,4:48},merge:['A1:H1','A2:N2']})],
    ['Storage history',sheet(r2,{widths:[13,30,24,12,10,15,15,12,15],freeze:4,filter:`A4:I${r2.length}`,tall:{1:24,4:48}})],
    ['Care tasks',sheet(r3,{widths:[13,30,42,13,15,13],freeze:4,filter:`A4:F${r3.length}`,tall:{1:24,4:48}})],
    ['Method',sheet(r4,{widths:[26,18,16,16,16],tall:{1:24,4:34,10:34}})]];
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="2"><numFmt numFmtId="164" formatCode="mmm yyyy"/><numFmt numFmtId="165" formatCode="0.0&quot;×&quot;"/></numFmts>
<fonts count="5"><font><sz val="10.5"/><color rgb="FF1B2236"/><name val="Segoe UI"/></font><font><b/><sz val="10.5"/><color rgb="FFFFFFFF"/><name val="Segoe UI"/></font><font><b/><sz val="17"/><color rgb="FF1B2236"/><name val="Palatino Linotype"/></font><font><i/><sz val="9.5"/><color rgb="FF6B7186"/><name val="Segoe UI"/></font><font><b/><sz val="10.5"/><color rgb="FF1B2236"/><name val="Segoe UI"/></font></fonts>
<fills count="6"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1B2236"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDDF0E5"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFBEBCD"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF6DAD6"/></patternFill></fill></fills>
<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left/><right/><top/><bottom style="thin"><color rgb="FFDDD6C6"/></bottom><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="14"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>
<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>
<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/>
<xf numFmtId="1" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1"/>
<xf numFmtId="9" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1"/>
<xf numFmtId="164" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right"/></xf>
<xf numFmtId="165" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1"/>
<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"/>

<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const files=[['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${S.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>`],
    ['_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`],

    ['xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${S.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${S.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml',styles], ...S.map(([,x],i)=>[`xl/worksheets/sheet${i+1}.xml`,x])];
  return zip(files);
}

function render(){renderList();renderCard()}
$('list').addEventListener('click',e=>{const b=e.target.closest('.pitem');if(b){cur=b.dataset.id;history.replaceState(null,'','#part='+cur);render()}});
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){filt=b.dataset.f;renderList()}});
$('q').addEventListener('input',renderList);
$('xl').addEventListener('click',()=>save(xlsxRegister(),'Material-Health-Register-'+stampNo()+'.xlsx'));
$('card').addEventListener('input',e=>{if(e.target.id==='ah'){state[cur].ahead=+e.target.value;paint(true)}});
$('card').addEventListener('click',e=>{
  const st=state[cur];
  if(e.target.dataset.care!==undefined){st.done[e.target.dataset.care]=true;renderList();paint(true)}
  else if(e.target.id==='mv'){st.moved=!st.moved;render()}
  // a certificate always describes today, so any look-ahead is cleared first
  // the certificate always describes today, whatever the look-ahead shows
  else if(e.target.id==='pdf'){const p=PARTS.find(x=>x.id===cur);save(new Blob([pdfCertificate(p)],{type:'application/pdf'}),'MHC-'+p.id+'-'+stampNo()+'.pdf')}
});
function fromHash(){const h=(location.hash.match(/part=(\d+)/)||[])[1]; if(h&&PARTS.some(p=>p.id===h))cur=h; render()}
addEventListener('hashchange',fromHash);
fromHash();
</script>
